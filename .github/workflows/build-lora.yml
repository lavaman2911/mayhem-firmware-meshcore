name: Build LoRa firmware

on:
  push:
    branches:
      - lora-base
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: default
            device_name: HackRF
            cmake_args: ""
          - device: hpro
            device_name: HackRF Pro
            cmake_args: "-DBOARD=PRALINE"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Apply MeshCore PHY-test RX fix
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path
          path = Path("firmware/baseband/proc_lora.cpp")
          text = path.read_text()
          if "PHY test mode (local_node_id_==0)" in text:
              print("Already patched")
          else:
              needle = "if (dest != 0xFFFFFFFFu && !(local_node_id_ && dest == local_node_id_))"
              if needle not in text:
                  idx = text.find("0xFFFFFFFFu")
                  print("Context:", repr(text[max(0,idx-120):idx+120]) if idx>=0 else "missing")
                  raise SystemExit("needle not found")
              # Replace only the if-condition line to accept all frames when local_node_id_==0
              text = text.replace(
                  needle,
                  "if (local_node_id_ && dest != 0xFFFFFFFFu && dest != local_node_id_)",
                  1,
              )
              path.write_text(text)
              print("Applied dest-filter fix (MeshCore PHY test mode)")
              # verify
              assert "if (local_node_id_ && dest != 0xFFFFFFFFu && dest != local_node_id_)" in path.read_text()
              print("Verified OK")
          PY

      - name: Build Docker image
        run: docker build -t portapack-dev -f dockerfile-nogit .

      - name: Create build directory
        run: mkdir -p build

      - name: Build firmware
        run: docker run -e VERSION_STRING=lora-test -i -v "${{ github.workspace }}:/havoc" portapack-dev ${{ matrix.cmake_args }}

      - name: Package firmware
        run: |
          mkdir -p output
          cp build/firmware/portapack-mayhem-firmware.bin output/portapack-mayhem-lora-${{ matrix.device }}.bin
          if [ -f build/firmware/portapack-mayhem_OCI.ppfw.tar ]; then
            cp build/firmware/portapack-mayhem_OCI.ppfw.tar output/portapack-mayhem-lora-${{ matrix.device }}.ppfw.tar
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lora-firmware-${{ matrix.device }}
          path: output/
